<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Ecospring | Smart Manufacturing Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <style>
        * { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        
        [x-cloak] { display: none !important; }

        /* Premium gradient background */
        .spacer-bg {
            background: radial-gradient(circle at 20% 30%, #0f2b6d, #1e3a8a, #1d4ed8);
            position: relative;
            overflow: hidden;
        }
        
        .spacer-bg::after {
            content: "";
            position: absolute;
            width: 200%; height: 200%;
            top: -50%; left: -50%;
            background: radial-gradient(circle, rgba(255,255,255,0.06) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: slowDrift 30s linear infinite;
            pointer-events: none;
        }
        
        @keyframes slowDrift {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(-10%, -10%) rotate(2deg); }
        }

        /* Fixed Input heights to prevent "jumpy" layout on error */
        .spacer-input, .custom-select {
            border: none;
            border-bottom: 2px solid #e2e8f0;
            border-radius: 0;
            padding: 0.75rem 0;
            background: transparent;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            font-size: 0.95rem;
            width: 100%;
            outline: none;
            height: 48px;
        }
        
        .spacer-input:focus, .custom-select:focus {
            border-bottom-color: #3b82f6;
            box-shadow: 0 1px 0 0 #3b82f6;
        }

        .error-space {
            min-height: 20px; /* Reserves space for error messages */
        }
        
        /* Smooth transitions */
        .fade-transition {
            transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Button hover effects */
        .btn-primary {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 20px -10px rgba(59,130,246,0.5);
        }

        .cloud-divider {
            position: absolute;
            right: -1px;
            top: 0;
            height: 100%;
            width: 80px;
            fill: #ffffff;
            z-index: 10;
        }

        /* Hide scrollbar but keep functionality */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="antialiased min-h-screen flex items-center justify-center p-4 bg-slate-100">

<div class="flex w-full max-w-5xl min-h-[720px] bg-white rounded-3xl shadow-2xl overflow-hidden relative" 
     x-data="authApp()" 
     x-cloak>
    
    <div class="hidden lg:flex w-5/12 spacer-bg relative flex-col items-center justify-center text-center p-12 text-white">
        <svg class="cloud-divider" viewBox="0 0 100 100" preserveAspectRatio="none">
            <path d="M0 0 C 30 40, 70 60, 100 100 L 100 0 Z" />
        </svg>
        
        <div class="relative z-20">
            <div class="w-20 h-20 bg-white/10 backdrop-blur-lg rounded-2xl flex items-center justify-center mb-8 mx-auto border border-white/20 shadow-2xl">
                <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 7.5l-9-5.25L3 7.5m18 0l-9 5.25m9-5.25v9l-9 5.25M3 7.5l9 5.25M3 7.5v9l9 5.25m0-5.25v9" />
                </svg>
            </div>
            <h1 class="text-4xl font-bold tracking-tight mb-4">Ecospring</h1>
            <p class="text-white/70 text-sm leading-relaxed font-light max-w-xs mx-auto">
                Next-generation intelligence for sustainable manufacturing and global supply chains.
            </p>
        </div>
    </div>

    <div class="w-full lg:w-7/12 flex flex-col relative bg-white overflow-hidden">
        
        <div class="flex-1 overflow-y-auto no-scrollbar px-8 sm:px-16 py-12">
            
            <div x-show="showLogin" 
                 x-transition:enter="fade-transition"
                 x-transition:enter-start="opacity-0 translate-y-4"
                 x-transition:enter-end="opacity-100 translate-y-0"
                 x-transition:leave="fade-transition"
                 x-transition:leave-start="opacity-100 scale-100"
                 x-transition:leave-end="opacity-0 scale-95"
                 class="w-full">
                
                <div class="mb-10">
                    <h2 class="text-3xl font-bold text-slate-800">Welcome back</h2>
                    <p class="text-slate-500 mt-2">Enter your credentials to access the portal</p>
                </div>
                
                <form @submit.prevent="handleLogin" class="space-y-5">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Username / Email</label>
                        <input type="text" x-model="loginData.username" placeholder="name@ecospring.com" class="spacer-input">
                        <div class="error-space text-red-500 text-xs mt-1"><span x-show="errors.loginUsername" x-text="errors.loginUsername"></span></div>
                    </div>
                    
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Password</label>
                        <div class="relative">
                            <input :type="showPassword ? 'text' : 'password'" x-model="loginData.password" placeholder="••••••••" class="spacer-input pr-10">
                            <button type="button" @click="showPassword = !showPassword" class="absolute right-0 bottom-3 text-slate-400 hover:text-blue-600 transition-colors">
                                <svg x-show="!showPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
                                <svg x-show="showPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" /></svg>
                            </button>
                        </div>
                        <div class="error-space text-red-500 text-xs mt-1"><span x-show="errors.loginPassword" x-text="errors.loginPassword"></span></div>
                    </div>

                    <div class="flex items-center justify-between py-2">
                        <label class="flex items-center gap-2 text-sm text-slate-600 cursor-pointer">
                            <input type="checkbox" x-model="loginData.remember" class="w-4 h-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500"> 
                            <span>Keep me signed in</span>
                        </label>
                        <a href="#" class="text-sm font-medium text-blue-600 hover:text-blue-700">Forgot?</a>
                    </div>

                    <button type="submit" class="btn-primary w-full bg-blue-600 text-white py-4 rounded-xl font-bold shadow-lg flex justify-center items-center gap-3" :disabled="loading">
                        <template x-if="loading">
                            <svg class="w-5 h-5 animate-spin" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                        </template>
                        <span x-text="loading ? 'Verifying...' : 'Sign In to Portal'"></span>
                    </button>
                    
                    <p class="text-center text-sm text-slate-500 pt-4">
                        New user? <button type="button" @click="switchToRegister" class="text-blue-600 font-bold hover:underline">Request access</button>
                    </p>
                </form>
            </div>

            <div x-show="!showLogin" 
                 x-transition:enter="fade-transition"
                 x-transition:enter-start="opacity-0 translate-y-4"
                 x-transition:enter-end="opacity-100 translate-y-0"
                 x-transition:leave="fade-transition"
                 x-transition:leave-start="opacity-100 scale-100"
                 x-transition:leave-end="opacity-0 scale-95"
                 class="w-full">
                
                <div class="mb-8">
                    <h2 class="text-3xl font-bold text-slate-800">Account Request</h2>
                    <p class="text-slate-500 mt-2">Fill in your professional details below</p>
                </div>
                
                <form @submit.prevent="handleRegister" class="space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase mb-1">First Name</label>
                            <input type="text" x-model="registerData.firstName" class="spacer-input" placeholder="Jane">
                            <div class="error-space text-red-500 text-[10px] mt-1"><span x-show="errors.firstName" x-text="errors.firstName"></span></div>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Last Name</label>
                            <input type="text" x-model="registerData.lastName" class="spacer-input" placeholder="Smith">
                            <div class="error-space text-red-500 text-[10px] mt-1"><span x-show="errors.lastName" x-text="errors.lastName"></span></div>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Employee ID</label>
                            <input type="text" x-model="registerData.employeeId" placeholder="EC-0000" class="spacer-input">
                            <div class="error-space text-red-500 text-[10px] mt-1"><span x-show="errors.employeeId" x-text="errors.employeeId"></span></div>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Gender</label>
                            <select x-model="registerData.gender" class="custom-select">
                                <option value="">Select</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Non-binary">Non-binary</option>
                            </select>
                            <div class="error-space"></div>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Work Email</label>
                        <input type="email" x-model="registerData.email" placeholder="jane@ecospring.com" class="spacer-input">
                        <div class="error-space text-red-500 text-[10px] mt-1"><span x-show="errors.email" x-text="errors.email"></span></div>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Password</label>
                            <input type="password" x-model="registerData.password" class="spacer-input" placeholder="••••••••">
                            <div class="error-space text-red-500 text-[10px] mt-1"><span x-show="errors.password" x-text="errors.password"></span></div>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Confirm</label>
                            <input type="password" x-model="registerData.confirmPassword" class="spacer-input" placeholder="••••••••">
                            <div class="error-space text-red-500 text-[10px] mt-1"><span x-show="errors.confirmPassword" x-text="errors.confirmPassword"></span></div>
                        </div>
                    </div>

                    <div class="flex items-start gap-3 py-2">
                        <input type="checkbox" x-model="registerData.agreeTerms" class="mt-1 w-4 h-4 text-blue-600 rounded border-slate-300">
                        <label class="text-xs text-slate-500 leading-tight">By clicking create, you agree to the Ecospring Data Processing Agreement and Privacy Policy.</label>
                    </div>

                    <button type="submit" class="btn-primary w-full bg-slate-900 text-white py-4 rounded-xl font-bold shadow-lg flex justify-center items-center gap-3 mt-2" :disabled="loading">
                        <span x-text="loading ? 'Processing...' : 'Create Account'"></span>
                    </button>
                    
                    <p class="text-center text-sm text-slate-500 pt-2">
                        Already have access? <button type="button" @click="switchToLogin" class="text-blue-600 font-bold hover:underline">Sign in</button>
                    </p>
                </form>
            </div>
        </div>
    </div>

    <div x-show="toastVisible" 
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0 translate-y-10"
         x-transition:enter-end="opacity-100 translate-y-0"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         class="fixed bottom-8 right-8 bg-slate-900 text-white px-6 py-3 rounded-2xl shadow-2xl z-[100] flex items-center gap-3 border border-white/10">
        <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
        <span class="text-sm font-medium" x-text="toastMsg"></span>
    </div>
</div>

<script>
    function authApp() {
        return {
            showLogin: true,
            showPassword: false,
            loading: false,
            toastVisible: false,
            toastMsg: '',
            
            loginData: { username: '', password: '', remember: false },
            registerData: {
                firstName: '', lastName: '', employeeId: '', email: '', 
                gender: '', password: '', confirmPassword: '', agreeTerms: false
            },
            errors: {
                loginUsername: '', loginPassword: '',
                firstName: '', lastName: '', employeeId: '', email: '',
                password: '', confirmPassword: ''
            },
            
            switchToRegister() {
                this.clearErrors();
                this.showLogin = false;
            },
            
            switchToLogin() {
                this.clearErrors();
                this.showLogin = true;
            },
            
            clearErrors() {
                Object.keys(this.errors).forEach(k => this.errors[k] = '');
            },

            showToast(msg) {
                this.toastMsg = msg;
                this.toastVisible = true;
                setTimeout(() => this.toastVisible = false, 3000);
            },
            
            async handleLogin() {
                this.clearErrors();
                if (!this.loginData.username) return this.errors.loginUsername = 'Required';
                if (!this.loginData.password) return this.errors.loginPassword = 'Required';
                
                this.loading = true;
                await new Promise(r => setTimeout(r, 1200));
                this.loading = false;
                this.showToast("Successfully authenticated!");
            },
            
            async handleRegister() {
                this.clearErrors();
                let hasError = false;
                if (!this.registerData.firstName) { this.errors.firstName = 'Required'; hasError = true; }
                if (!this.registerData.email.includes('@')) { this.errors.email = 'Invalid email'; hasError = true; }
                if (this.registerData.password !== this.registerData.confirmPassword) { this.errors.confirmPassword = 'Mismatch'; hasError = true; }
                if (!this.registerData.agreeTerms) { this.showToast("Please agree to terms"); return; }
                
                if (hasError) return;

                this.loading = true;
                await new Promise(r => setTimeout(r, 1500));
                this.loading = false;
                this.showToast("Account request sent!");
                setTimeout(() => this.switchToLogin(), 1000);
            }
        }
    }
</script>
</body>
</html>
