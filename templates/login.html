<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecospring | Welcome</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #f8fafc; }
        
        /* Spacer Blue Gradient */
        .spacer-bg {
            background: linear-gradient(135deg, #1d4ed8 0%, #3b82f6 100%);
        }

        /* Underline Input Style */
        .spacer-input {
            border: none;
            border-bottom: 1.5px solid #e2e8f0;
            border-radius: 0;
            padding-left: 0;
            transition: all 0.3s ease;
        }
        .spacer-input:focus {
            border-bottom-color: #3b82f6;
            box-shadow: none;
            outline: none;
        }

        /* Cloud Divider Effect */
        .cloud-divider {
            position: absolute;
            right: -1px;
            top: 0;
            height: 100%;
            width: 120px;
            fill: #ffffff;
        }

        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="antialiased h-screen flex items-center justify-center p-4">

<div class="flex w-full max-w-6xl h-[700px] bg-white rounded-[2.5rem] shadow-2xl overflow-hidden" x-data="{ showLogin: true }">
    
    <div class="hidden lg:flex w-[40%] spacer-bg relative flex-col items-center justify-center text-center p-12 text-white">
        <svg class="cloud-divider" viewBox="0 0 100 100" preserveAspectRatio="none">
            <path d="M0 0 C 50 20, 80 50, 100 100 L 100 0 Z" />
        </svg>

        <div class="relative z-10">
            <div class="w-20 h-20 bg-white rounded-full flex items-center justify-center mb-6 mx-auto shadow-lg">
                <svg class="w-10 h-10 text-blue-600" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 2c0 0-8 8.4-8 13a8 8 0 1016 0c0-4.6-8-13-8-13z"/>
                </svg>
            </div>
            <h1 class="text-3xl font-bold mb-2 tracking-tight">Welcome to</h1>
            <h2 class="text-4xl font-extrabold mb-8 tracking-tighter">Ecospring</h2>
            <p class="text-blue-100 text-sm leading-relaxed opacity-90 max-w-xs">
                Your centralized command center architected for speed, precision, and the future of manufacturing.
            </p>
        </div>
    </div>

    <div class="w-full lg:w-[60%] flex flex-col justify-center px-12 lg:px-24 relative bg-white">
        
        <div x-show="showLogin" x-transition>
            <h2 class="text-2xl font-bold text-slate-800 mb-8">Access Portal</h2>
            
            <form action="/login" method="POST" class="space-y-8">
                <div class="relative">
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Username</label>
                    <input type="text" placeholder="Enter your username" class="w-full py-3 spacer-input text-slate-600 placeholder-slate-300">
                </div>

                <div class="relative">
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Password</label>
                    <input type="password" placeholder="Enter your password" class="w-full py-3 spacer-input text-slate-600 placeholder-slate-300">
                </div>

                <div class="flex items-center gap-4 pt-4">
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-10 py-3 rounded-full font-bold shadow-lg shadow-blue-200 transition-all">
                        Sign In
                    </button>
                    <button @click="showLogin = false" type="button" class="border border-slate-200 text-slate-400 px-10 py-3 rounded-full font-bold hover:bg-slate-50 transition-all">
                        Sign Up
                    </button>
                </div>
            </form>
        </div>

        <div x-show="!showLogin" x-transition x-cloak>
            <h2 class="text-2xl font-bold text-slate-800 mb-6">Create your account</h2>
            
            <form action="/register" method="POST" class="space-y-6">
                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">First Name</label>
                        <input type="text" placeholder="John" class="w-full py-2 spacer-input text-slate-600">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Last Name</label>
                        <input type="text" placeholder="Doe" class="w-full py-2 spacer-input text-slate-600">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Employee Email</label>
                    <input type="email" placeholder="name@ecospring.com" class="w-full py-2 spacer-input text-slate-600">
                </div>

                <div class="flex items-center gap-2">
                    <input type="checkbox" class="w-4 h-4 text-blue-600 border-slate-300 rounded">
                    <span class="text-xs text-slate-500">I agree to the <a href="#" class="text-blue-600 underline">Terms & Conditions</a></span>
                </div>

                <div class="flex items-center gap-4 pt-4">
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-10 py-3 rounded-full font-bold shadow-lg shadow-blue-200 transition-all">
                        Sign Up
                    </button>
                    <button @click="showLogin = true" type="button" class="text-slate-400 font-bold px-4 hover:text-slate-600">
                        Back to Login
                    </button>
                </div>
            </form>
        </div>

    </div>
</div>

</body>
</html>
