<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Access | Academia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .premium-glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.25);
        }
        .input-premium {
            background: rgba(255, 255, 255, 0.9);
            transition: all 0.3s ease;
        }
        .input-premium:focus {
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center relative overflow-hidden bg-slate-900">
    
    <div class="absolute inset-0 z-0">
        <div class="absolute inset-0 bg-gradient-to-br from-[#020617] via-[#0f172a] to-[#1e3a8a] z-10 opacity-90"></div>
        <img src="https://images.unsplash.com/photo-1562774053-701939374585?q=80&w=2086&auto=format&fit=crop" class="w-full h-full object-cover filter grayscale" alt="Campus">
        
        <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-blue-600 rounded-full mix-blend-screen filter blur-[100px] opacity-40 animate-pulse z-20"></div>
        <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-sky-400 rounded-full mix-blend-screen filter blur-[100px] opacity-30 z-20"></div>
    </div>

    <div class="fixed top-6 right-6 z-50 flex flex-col gap-3">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div x-data="{ show: true }" x-show="show" x-init="setTimeout(() => show = false, 5000)"
                         class="flex items-center p-4 rounded-2xl shadow-2xl text-sm font-semibold min-w-[320px] border backdrop-blur-md
                         {% if category == 'error' %} bg-red-500/90 text-white border-red-400 {% else %} bg-blue-600/90 text-white border-blue-400 {% endif %}">
                        <span class="flex-1 tracking-wide">{{ message }}</span>
                        <button @click="show = false" class="ml-4 text-white/70 hover:text-white transition-colors">✕</button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
    </div>

    <div class="relative z-30 w-full max-w-lg p-10 premium-glass rounded-[2.5rem] mx-4">
        
        <div class="text-center mb-10">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-tr from-blue-700 to-blue-500 rounded-2xl mb-5 shadow-lg shadow-blue-500/40">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"></path></svg>
            </div>
            <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Academia Hub</h1>
            <p class="text-slate-500 mt-2 font-medium">Enter your credentials to continue</p>
        </div>

        <form action="/login" method="POST" class="space-y-6">
            
            <div>
                <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-widest mb-2">Portal Role</label>
                <div class="relative">
                    <select name="role" required class="input-premium w-full px-5 py-4 rounded-xl border border-slate-200 focus:border-blue-500 outline-none text-slate-700 font-semibold appearance-none cursor-pointer">
                        <option value="" disabled selected>Select your role...</option>
                        <option value="student">Student</option>
                        <option value="teacher">Teacher</option>
                        <option value="admin">Administrator</option>
                    </select>
                    <div class="absolute inset-y-0 right-0 flex items-center px-5 pointer-events-none text-blue-500">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"></path></svg>
                    </div>
                </div>
            </div>

            <div>
                <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-widest mb-2">Identification</label>
                <input type="text" name="username" required placeholder="University ID or Username" class="input-premium w-full px-5 py-4 rounded-xl border border-slate-200 focus:border-blue-500 outline-none text-slate-800 font-semibold placeholder-slate-400">
            </div>

            <div>
                <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-widest mb-2">Password</label>
                <input type="password" name="password" required placeholder="••••••••" class="input-premium w-full px-5 py-4 rounded-xl border border-slate-200 focus:border-blue-500 outline-none text-slate-800 font-semibold placeholder-slate-400">
            </div>

            <div class="flex items-center justify-between pt-2">
                <label class="flex items-center gap-3 cursor-pointer group">
                    <input type="checkbox" class="w-4 h-4 rounded text-blue-600 focus:ring-blue-500 border-slate-300 cursor-pointer">
                    <span class="text-sm font-semibold text-slate-600 group-hover:text-blue-700 transition-colors">Remember me</span>
                </label>
                <a href="#" class="text-sm font-bold text-blue-600 hover:text-blue-800 transition-colors">Recover Password</a>
            </div>

            <button type="submit" class="w-full bg-gradient-to-r from-blue-700 to-blue-600 hover:from-blue-800 hover:to-blue-700 text-white font-bold py-4 px-4 rounded-xl shadow-lg shadow-blue-600/30 transition-all duration-300 mt-6 flex justify-center items-center gap-2 group">
                Authorize Access
                <svg class="w-5 h-5 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
            </button>
        </form>
    </div>
</body>
</html>
